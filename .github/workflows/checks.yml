name: checks

on:
  push:
    branches: [main]
  pull_request:
  # /ship dispatches a run after flipping the repo public, since the flip
  # itself triggers no push event.
  workflow_dispatch:

# One deploy at a time, and never cancel one mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    # Runs once the repo is public; `pnpm check` runs the same checks
    # locally, from the same script.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the secret scan can see all commits
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Check it as `pnpm check` does
        # scripts/check.sh's web half: the TypeScript, the client, the spec
        # against a fresh copy of the app built from the Dockerfile Fly
        # deploys, the app's own log lines and the process evidence. The
        # same script runs locally, so the two can't drift
        # (spec/check-alignment.test.ts).
        run: pnpm check web
        env:
          CHECK_RUNNER: docker
      - name: Scan for committed secrets
        # Pinned in both halves (action SHA and scanner image) because this
        # runs in every repo in the course. Bump between semesters.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: --only-verified
      - name: Scan for a committed course key
        # A course key has no verifier a runner can reach, so this pass
        # matches its shape instead (.github/trufflehog.yml).
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: >-
            --config=.github/trufflehog.yml
            --include-detectors=CustomRegex --results=unverified
            --no-verification

  rust:
    # The server's own rules, format and lints, and the drift check on the
    # TypeScript generated from its types.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Check it as `pnpm check` does
        # scripts/check.sh's rust half
        run: bash scripts/check.sh rust

  deploy:
    needs: [check, rust]
    # The template repo itself has no Fly app; only student repos deploy.
    if: ${{ !github.event.repository.private && !github.event.repository.is_template && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Registers the GitHub Deployment with the live URL. The app is named
    # after this repo, so the URL needs no lookup.
    environment:
      name: fly
      url: https://${{ github.event.repository.name }}.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_URL: https://${{ github.event.repository.name }}.fly.dev
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy
        # --remote-only builds the Dockerfile on Fly's builders; --ha=false
        # keeps the app at one machine and one volume.
        run: flyctl deploy --remote-only --ha=false -a ${{ github.event.repository.name }}
      - name: Verify the deployed site is online
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" || true)
            if [ "$code" = "200" ]; then echo "online: $APP_URL"; exit 0; fi
            echo "attempt $i: HTTP $code, retrying in 10s..."
            sleep 10
          done
          echo "site did not return 200"; exit 1
