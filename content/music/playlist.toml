# The café's music (slice 15, ADR 0020): a day set and a night set, played
# in this order and looping, each visitor from their own player. The night
# set plays from 17:00 to 6:00 Canberra time, the day set otherwise.
#
# Each track: its title and artist as the panel shows them, its file here,
# the page it came from and its licence. A new track is a file and an
# entry here, never code. The files are written by scripts/music.ts from
# the originals, re-encoded to 128 kbps at an even loudness, and
# manifest.json records each one's hash and the loudness measured on it;
# don't edit them by hand. Credits: CREDITS.md.
#
# The client reads this file with a small reader of its own: `[[day]]` and
# `[[night]]` tables of `key = "quoted string"` lines, with comments.

