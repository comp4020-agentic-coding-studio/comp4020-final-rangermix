# The street behind the café (slice 13), as the client draws it round the
# room's diamond: sky above, the towers across the road against it, then
# the kerb and the pavement at the room's foot. Its colours are in
# sprites/palettes.json, under "street", by day and by night.
#
# horizon: how far down the backdrop the skyline's foot stands, 0 to 1.
# towers: left to right, repeated across the backdrop. width in room pixels
#   at 1×; height as a share of the sky above the skyline.
# windows: every `every` pixels across and up a tower, a window `size` pixels
#   square; `lit` of them in 10 are lit, by a fixed pattern.
# clouds: each one where it floats, `x` and `y` its middle in room pixels
#   at 1x on the room's backdrop (400 by 264 since slice 16's 13 by 12
#   floor), and `width` across; drawn behind the
#   towers. The sky that shows is the two top corners the room's walls leave
#   (above the street wall on the left, the plain wall on the right), so
#   that's where they float. White with a warm underside by day, faint by
#   night.
#
# terrace (slice 16): the café's own pavement in the room's two bottom
#   corners, each thing standing by the floor's left edge or its front: its
#   `kind` (bench, planter, table, umbrella, chair, lamp: each drawn as its
#   own few blocks), its `side` ("left" or "front"), how far `along` that
#   edge from its back end, in tiles, and how far `out` from it. Scenery:
#   off the café's grid, it takes no click and blocks no one.
#
# The client reads this file with a small reader of its own (street.ts):
# plain `key = number` and `key = "word"` lines, the one `[windows]` table
# and `[[towers]]`, `[[clouds]]` and `[[terrace]]` tables, with comments.
# Write it in that much TOML only; anything else (inline tables, dotted
# keys, underscores in numbers) stops the client loading, though it's valid
# TOML that `cargo test` reads.

horizon = 0.55

# The sky warms low down by the skyline, as the sun does on a café's street:
# how far up the sky the warm band reaches, dithered into the blue above it,
# 0 to 0.6. By night its colour is the sky's own, so nothing warm shows.
glow = 0.3

[windows]
every = 4
size = 1
lit = 4

[[towers]]
width = 22
height = 0.62

[[towers]]
width = 14
height = 0.85

[[towers]]
width = 26
height = 0.5

[[towers]]
width = 18
height = 0.95

[[towers]]
width = 12
height = 0.7

[[towers]]
width = 24
height = 0.58

[[towers]]
width = 16
height = 0.88

[[clouds]]
x = 30
y = 26
width = 40

[[clouds]]
x = 92
y = 42
width = 28

[[clouds]]
x = 14
y = 60
width = 22

[[clouds]]
x = 326
y = 16
width = 44

[[clouds]]
x = 382
y = 36
width = 30

[[clouds]]
x = 300
y = 30
width = 20

# The terrace (slice 16), placed where 1920×1080 shows it, clear of the
# panels and the talk bar where they start. By the left edge: a bench along
# it between two planters.
[[terrace]]
kind = "planter"
side = "left"
along = 4.0
out = 1.8

[[terrace]]
kind = "bench"
side = "left"
along = 5.6
out = 1.3

[[terrace]]
kind = "planter"
side = "left"
along = 7.2
out = 1.8

# Out front, right of the middle: a table with a folded parasol and two
# chairs, and a low lantern, lit at night. Everything here is low and set
# out from the floor's edges: something tall out front stands over the
# floor's front tiles on screen, hiding who's there and taking clicks
# meant for them (slice 16's review, finding 2). A render test holds it.
[[terrace]]
kind = "table"
side = "front"
along = 6.5
out = 1.7

[[terrace]]
kind = "umbrella"
side = "front"
along = 6.5
out = 1.7

[[terrace]]
kind = "chair"
side = "front"
along = 5.7
out = 1.7

[[terrace]]
kind = "chair"
side = "front"
along = 7.3
out = 1.7

[[terrace]]
kind = "lamp"
side = "front"
along = 9.2
out = 1.7
