# What each kind of furniture is. w and h are in tiles. People can't walk
# through a piece that blocks; cats walk and jump over everything. nap, hide
# and perch mark where cats like to do those things.
#
# movable: anyone inside can carry it, put it away, or add one from the
# catalogue (every movable kind is in it). under: other pieces can stand on
# it, as on a rug. seats: people can sit on it, one to a tile.

[kinds.cat_tower]
w = 2
h = 2
blocks = true
nap = true
hide = true
movable = true

[kinds.window_seat]
w = 2
h = 1
blocks = true
nap = true
perch = true
seats = true
movable = true

[kinds.sofa]
w = 3
h = 1
blocks = true
nap = true
seats = true
movable = true

[kinds.rug]
w = 4
h = 3
under = true
movable = true

[kinds.table]
w = 2
h = 1
blocks = true
movable = true

[kinds.chair]
w = 1
h = 1
blocks = true
seats = true
movable = true

[kinds.cat_bed]
w = 1
h = 1
blocks = true
nap = true
movable = true

[kinds.box]
w = 1
h = 1
blocks = true
nap = true
hide = true
movable = true

[kinds.plant]
w = 1
h = 1
blocks = true
movable = true

# The bowls stay where the café fills them.
[kinds.bowls]
w = 2
h = 1
blocks = true

[kinds.toys]
