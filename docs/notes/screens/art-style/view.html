<!doctype html>
<html lang="en">
<!--
  Throwaway art-style study for docs/notes/art-style.md. Not the café's code.

  The café's room, furniture, cats and people are modelled once, then drawn
  pixel by pixel with no anti-aliasing through two cameras: the 2:1
  isometric one the café uses now (client/src/iso.ts), and a Stardew-style
  top-down 3/4 one. Furniture is boxes and ellipsoids hit by a ray per
  pixel, so overlaps are exact; cats and people are flat sprites shaped
  the way docs/notes/screens/visual-direction/scripts/density.mjs shaped
  its cats. Colours are the café's own (content/sprites/palettes.json).

  Build and screenshot it with render.mjs beside this file, which fills in
  the two placeholders below.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art-style study</title>
<style>
  :root { color-scheme: dark; --bg: #1e1e2e; --card: #262637; --ink: #cdd6f4; --muted: #a6adc8; --line: #45475a; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 24px 16px 64px; }
  section { margin: 0 0 40px; padding: 16px; background: #212131; border-radius: 12px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  h2 { font-size: 1.15rem; margin: 0 0 6px; }
  p { margin: 0 0 12px; max-width: 80ch; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; max-width: 62ch; }
  figcaption b { color: var(--ink); }
  canvas { display: block; image-rendering: pixelated; }
  table.sheet { border-collapse: separate; border-spacing: 8px 8px; }
  table.sheet th { font-weight: 600; font-size: 13px; color: var(--muted); text-align: left; vertical-align: middle; padding-right: 6px; }
  table.sheet td { background: #2f2e42; border-radius: 8px; padding: 8px; vertical-align: bottom; }
</style>

const rgbC = new Map();

const norm = (v) => { const l = Math.hypot(...v); return v.map((x) => x / l); };

class Grid {

const ell = (cx, cy, rx, ry) => (u, v) => ((u - cx) / rx) ** 2 + ((v - cy) / ry) ** 2 <= 1;

  // The numbers behind "shaking": per-frame steps at 60 fps on a leg, and the follow-camera's wobble.
  const cam = isoCam(32); const steps = {}; let prev = null;
  for (let f = 0; f < 60; f++) { const [X, Y] = cam.project(1.5, 4.5 - (f / 60) * 3, 0); const p = [Math.round(X), Math.round(Y)]; if (prev) { const k = `${p[0] - prev[0]},${p[1] - prev[1]}`; steps[k] = (steps[k] || 0) + 1; } prev = p; }
  numbers.walk = { stepsPerSecondAt60fps: steps };
}

// 3. Corners.
function cornerSection() {
  const s = section("3-corners", "3. The empty corners: embrace them, fill them, or use them",
    "A 2:1 room's floor is a diamond, and a diamond fills half its bounding box, so about 40% of the frame is backdrop whatever the art. These keep the camera and do something with the space.");
  const cam = isoCam(32);
  const make = (opts) => render(cam, cafe(cam, opts.night ? night : day, opts));
  const now = make({ bg: "void" }), dio = make({ bg: "diorama", slab: 0.45 }), city = make({ bg: "city", slab: 0.45, night: true });
  numbers.corners = { void: now.roomShare, diorama: dio.roomShare };
  s.append(el("div", { className: "row" },
    fig(canvasOf(now.g, 2), `<b>A. As now.</b> The room floats on a flat backdrop. ${(100 - now.roomShare * 100).toFixed(0)}% of the frame is empty.`),
    fig(canvasOf(dio.g, 2), "<b>B. A diorama.</b> Give the floor a thickness and the walls a top, and set it on a soft glow: the empty space reads as framing, the way an isometric lofi room is usually shown."),
    fig(canvasOf(city.g, 2), "<b>C. The city behind it.</b> The same diorama at night with the street's towers behind, so the top corners hold sky and lit windows.")));
  // D: the panels in the corners, so the room can grow from 3× to 4×.
  const mock = (scaleReal, floating) => {
    const W = 640, H = 360, k = 1 / 3; const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const x = cv.getContext("2d");
    x.imageSmoothingEnabled = false; x.fillStyle = "#1e1e2e"; x.fillRect(0, 0, W, H);
    const roomC = canvasOf(dio.g, 1); const rw = dio.W * scaleReal * k, rh = dio.H * scaleReal * k;
    const panel = (px, py, pw, ph, label) => { x.fillStyle = "rgba(49,50,68,0.92)"; x.fillRect(px, py, pw, ph); x.strokeStyle = "#45475a"; x.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1); x.fillStyle = "#a6adc8"; x.font = "9px system-ui"; x.fillText(label, px + 5, py + 12); };
    if (!floating) {
      panel(4, 24, 91, 332, "Chalkboard · cats"); panel(545, 24, 91, 332, "Here · said");
      x.drawImage(roomC, 99 + (432 - rw) / 2, 24 + (316 - rh) / 2, rw, rh);
    } else {
      x.drawImage(roomC, (W - rw) / 2, 22 + (316 - rh) / 2, rw, rh);
      panel(6, 24, 120, 92, "Chalkboard"); panel(6, 250, 120, 92, "Your cats"); panel(514, 24, 120, 70, "Here (2/6)");
    }
    x.fillStyle = "#313244"; x.fillRect(100, 344, 440, 12); x.fillStyle = "#a6adc8"; x.font = "9px system-ui"; x.fillText("Say something…", 106, 353);
    return cv;
  };
  s.append(el("div", { className: "row", style: "margin-top:14px" },
    fig(mock(3, false), "<b>The page now, at 1920×1080 (shown at a third).</b> The panels take two columns, so the room fits at 3×."),
    fig(mock(4, true), "<b>D. Panels float in the corners.</b> The empty triangles hold the chalkboard, the cats and who's here, and the room grows to 4×, 78% more room on screen.")));
}

// 4. Density. Each row is one density, shown at the same size on screen as
// the game would show it: 16-px tiles at 6×, 24 at 4×, 32 at 3×, 48 at 2×.
// Top-down squares are three quarters of the isometric diamond's width, so
// the room comes out about the same size on screen in either camera.
const DENS = [16, 24, 32, 48];
const topT = (T) => Math.round(0.75 * T);
function densitySection() {
  const s = section("4-density", "4. Cats, people and furniture at four densities",
    ["Each row is drawn at a different pixel count and shown at the same size on screen, as the game would: 16-px tiles at 6×, 24 at 4×, 32 at 3×, 48 at 2×. Cats are three quarters of a tile across, people a tenth taller than a tile is wide. ADR 0017 chose the 32-px row; the café now draws 16-px sprites (the first row's people and cats are close to them) in a 32-px room.",
     "Cats and people are drawn the same in either camera; furniture isn't, so it's shown both ways below."]);
  const C = day.coats;
  const t1 = el("table", { className: "sheet" });
  const h1 = el("tr"); for (const x of ["", "Tora, Mochi, Burakku sitting", "Napping, napping, walking", "People: front, front, back, mid-step"]) h1.append(el("th", { textContent: x })); t1.append(h1);
  for (const T of DENS) {
    const tr = el("tr"), n = Math.round(0.75 * T), np = Math.round(1.1 * T), k = 96 / T;
    tr.append(el("th", { innerHTML: `${T}-px tiles<br>cats ${n} px<br>people ${np} px` }));
    tr.append(el("td", {}, canvasOf(hstack([catSit(n, C.orange_tabby, "tora"), catSit(n, C.white_grey, "mochi"), catSit(n, C.black, "burakku")], 1), k)));
    tr.append(el("td", {}, canvasOf(hstack([catNap(n, C.orange_tabby, "tora"), catNap(n, C.white_grey, "mochi"), catWalk(n, C.black, "burakku", 0)], 1), k)));
    tr.append(el("td", {}, canvasOf(hstack([person(np, lookOf(day, 0, 0)), person(np, lookOf(day, 2, 3)), person(np, lookOf(day, 3, 4), "back"), person(np, lookOf(day, 1, 2), "front", 1)], 1), k)));
    t1.append(tr);
  }
  const t2 = el("table", { className: "sheet", style: "margin-top:10px" });
  const h2 = el("tr"); for (const x of ["", "Isometric: sofa, chair, cat tower, plant", "Top-down 3/4: the same four"]) h2.append(el("th", { textContent: x })); t2.append(h2);
  for (const T of DENS) {
    const tr = el("tr"), k = 96 / T;
    tr.append(el("th", { textContent: `${T}-px tiles` }));
    tr.append(el("td", {}, canvasOf(hstack(["sofa", "chair", "cat_tower", "plant"].map((kd) => piece(isoCam(T), day, kd)), 2), k)));
    tr.append(el("td", {}, canvasOf(hstack(["sofa", "chair", "cat_tower", "plant"].map((kd) => piece(topCam(topT(T)), day, kd)), 2), k)));
    t2.append(tr);
  }
  s.append(t1, t2);
}

// 4b. The café's corner at each density, both cameras.
function contextSection() {
  const s = section("4b-in-the-room", "4b. The same corner of the café at each density",
    "The sofa, the cat bed, the box and the rug's edge, with Burakku napping, Tora on the rug and two people, at the same on-screen size in every row.");
  const t = el("table", { className: "sheet" });
  const tr0 = el("tr"); for (const x of ["", "Isometric", "Top-down 3/4"]) tr0.append(el("th", { textContent: x })); t.append(tr0);
  // The part of the room shown: x 0 to 7, y 4.4 to 10, up to 1.7 tiles high.
  const region = (cam, r) => {
    const pts = [];
    for (const x of [0, 7]) for (const y of [4.4, 10]) for (const z of [0, 1.7]) pts.push(cam.project(x, y, z));
    const x0 = Math.floor(Math.min(...pts.map((p) => p[0])) - r.minX), x1 = Math.ceil(Math.max(...pts.map((p) => p[0])) - r.minX);
    const y0 = Math.floor(Math.min(...pts.map((p) => p[1])) - r.minY), y1 = Math.ceil(Math.max(...pts.map((p) => p[1])) - r.minY);
    return r.g.crop(Math.max(0, x0), Math.max(0, y0), Math.min(r.W, x1) - Math.max(0, x0), Math.min(r.H, y1) - Math.max(0, y0));
  };
  for (const T of DENS) {
    const tr = el("tr"); tr.append(el("th", { textContent: `${T}-px tiles` }));
    const iso = isoCam(T), top = topCam(topT(T));
    tr.append(el("td", {}, canvasOf(region(iso, render(iso, cafe(iso, day, { Tiso: T }))), 96 / T)));
    tr.append(el("td", {}, canvasOf(region(top, render(top, cafe(top, day, { Tiso: T }))), 96 / T)));
    t.append(tr);
  }
  s.append(t);
}

// 5. Camera.
function cameraSection() {
  const s = section("5-camera", "5. The whole café in each camera, at the density ADR 0017 chose",
    "24-px cats in both. The isometric room on 32-px diamonds; the top-down one on 24-px squares. Day, then night.");
  const iso = isoCam(32), top = topCam(24);
  const ri = render(iso, cafe(iso, day, { bg: "diorama", slab: 0.45 })), rt = render(top, cafe(top, day, { Tiso: 32 }));
  const rin = render(iso, cafe(iso, night, { bg: "diorama", slab: 0.45, night: true })), rtn = render(top, cafe(top, night, { Tiso: 32, night: true }));
  numbers.camera = { iso: { w: ri.W, h: ri.H, share: ri.roomShare }, top: { w: rt.W, h: rt.H, share: rt.roomShare } };
  s.append(el("div", { className: "row" },
    fig(canvasOf(ri.g, 2), `<b>Isometric</b> (as diorama B), ${ri.W}×${ri.H} px, ${(ri.roomShare * 100).toFixed(0)}% of it room.`),
    fig(canvasOf(rt.g, 2), `<b>Top-down 3/4</b>, ${rt.W}×${rt.H} px, ${(rt.roomShare * 100).toFixed(0)}% of it room.`)));
  s.append(el("div", { className: "row", style: "margin-top:14px" }, fig(canvasOf(rin.g, 2), "<b>Isometric, night.</b>"), fig(canvasOf(rtn.g, 2), "<b>Top-down 3/4, night.</b>")));
  // How much of a 1920×1080 stage each fills at its largest whole scale.
  const stage = [1296, 950];
  const fitS = (r) => Math.max(1, Math.floor(Math.min(stage[0] / r.W, stage[1] / r.H)));
  const si = fitS(ri), st = fitS(rt);
  numbers.stage = { iso: { scale: si, share: (ri.W * si * ri.H * si * ri.roomShare) / (stage[0] * stage[1]) }, top: { scale: st, share: (rt.W * st * rt.H * st * rt.roomShare) / (stage[0] * stage[1]) } };
  s.append(el("p", { style: "margin-top:12px", innerHTML: `On a 1920×1080 screen the stage between the panels is about 1296×950. The isometric room fits at ${si}× and its room pixels cover ${(numbers.stage.iso.share * 100).toFixed(0)}% of the stage; the top-down one fits at ${st}× and covers ${(numbers.stage.top.share * 100).toFixed(0)}%.` }));
}

(async () => {
  await blurSection();
  walkSection();
  cornerSection();
  densitySection();
  contextSection();
  cameraSection();
  window.__numbers = numbers; window.__ready = true;
})().catch((e) => { document.body.prepend(el("pre", { textContent: String(e.stack || e) })); window.__error = String(e.stack || e); window.__ready = true; });
</script>
